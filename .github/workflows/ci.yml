name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary target; Linux is documented as best-effort, so it
        # is tested here rather than assumed. A Linux failure is information,
        # not a surprise — fail-fast is off so both platforms always report.
        os: [macos-latest, ubuntu-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret committed then deleted still leaks

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the tarball ships only build output and docs
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path).sort();
            const expected = ['LICENSE', 'README.md', 'dist/index.js', 'package.json'];
            const unexpected = files.filter(f => !expected.includes(f));
            if (unexpected.length) {
              console.error('Unexpected files in tarball:', unexpected);
              process.exit(1);
            }
            console.log('Tarball contents OK:', files.join(', '));
          "

      - name: Verify the server starts and completes an MCP handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node dist/index.js \
            | grep -q '"serverInfo"' || { echo "handshake produced no serverInfo"; exit 1; }
          echo "handshake OK"
